name: E2E staging (optional)

# Manual Playwright run with GitHub Actions secrets (Firebase login, Fan Hub flags, etc.).
# Tests that lack credentials skip themselves; set secrets + booleans to exercise deeper flows.

on:
  workflow_dispatch:

jobs:
  playwright-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests (preview + optional secrets)
        env:
          CI: true
          E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          E2E_PUBLIC_HANDLE: ${{ secrets.E2E_PUBLIC_HANDLE }}
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}
          E2E_TREATS_CREATOR_ID: ${{ secrets.E2E_TREATS_CREATOR_ID }}
          E2E_FAN_HUB_SMOKE: ${{ vars.E2E_FAN_HUB_SMOKE }}
          E2E_FAN_HUB_MESSAGES_SMOKE: ${{ vars.E2E_FAN_HUB_MESSAGES_SMOKE }}
          E2E_EXPECT_ADMIN: ${{ vars.E2E_EXPECT_ADMIN }}
        run: npm run test:e2e
